image:
  distribution: archlinux
  description: Arch Linux Custom Image
  architecture: aarch64

source:
  downloader: archlinux-http
  url: http://os.archlinuxarm.org
  keys:
    - 68B3537F39A313B3E574D06777193F152BDBE6A6
  keyserver: keyserver.ubuntu.com

files:
  - generator: dump
    path: /etc/systemd/network/eth0.network
    content: |-
      [Match]
      Name=eth0

      [Network]
      DHCP=yes
  - generator: copy
    source: ./images/scripts/setup.sh
    path: /root/setup.sh
    mode: 0755
  - generator: copy
    source: ./images/scripts/remove-docs.sh
    path: /root/remove-docs.sh
    mode: 0755
  - generator: copy
    source: ./images/scripts/prune-manpages
    path: /usr/local/bin/prune-manpages
    mode: 0755
  - generator: copy
    source: ./images/scripts/prune-manpages.hook
    path: /etc/pacman.d/hooks/prune-manpages.hook
    mode: 0644

packages:
  manager: pacman
  update: true
  cleanup: true
  repositories:
    - name: core
      url: http://nj.us.mirror.archlinuxarm.org/$arch/$repo

    - name: extra
      url: http://nj.us.mirror.archlinuxarm.org/$arch/$repo

    - name: alarm
      url: http://nj.us.mirror.archlinuxarm.org/$arch/$repo

    - name: aur
      url: http://nj.us.mirror.archlinuxarm.org/$arch/$repo

  sets:
    - packages:
        - base
        - base-devel
        - tmux
        - gnupg
        - zsh
        - zsh-syntax-highlighting
        - zsh-autosuggestions
        - git
        - vim
        - wget
        - curl
        - openssh
        - opendoas
        - zsh-completions
        - stow
        - knot-resolver
        - unzip
        - pacman-contrib
        - less
        - bc
        - tcpdump
        - strace
        - htop
        - ed
        - libxml2
        - ripgrep
        - fzf
        - html-xml-utils
        - pass
        - words
        - lsof
        - socat
        - openbsd-netcat
        - mtr
        - moreutils
        - lua
        - man-db
        - man-pages
        - bubblewrap
        - ccache
      action: install

actions:
  - trigger: post-unpack
    action: |-
      #!/bin/sh -eu
      echo 'Server = http://nj.us.mirror.archlinuxarm.org/$arch/$repo' > /etc/pacman.d/mirrorlist
      pacman-key --populate archlinuxarm
      if ! grep -q '^DownloadUser = root' /etc/pacman.conf; then
        sed -i '/^\[options\]/a DownloadUser = root' /etc/pacman.conf
      fi
      if ! grep -q '^DisableSandbox' /etc/pacman.conf; then
        sed -i '/^\[options\]/a DisableSandbox' /etc/pacman.conf
      fi
      if ! grep -q '^Include = /etc/pacman.d/noextract.conf' /etc/pacman.conf; then
        sed -i '/^\[options\]/a Include = /etc/pacman.d/noextract.conf' /etc/pacman.conf
      fi
      cat >/etc/pacman.d/noextract.conf <<'EOF'
      NoExtract = usr/share/doc/* usr/share/gtk-doc/*
      NoExtract = usr/share/locale/*
      NoExtract = !usr/share/locale/locale.alias
      NoExtract = usr/share/icons/*
      NoExtract = !usr/share/icons/hicolor/*
      NoExtract = !usr/share/icons/Adwaita/symbolic/*
      NoExtract = !usr/share/icons/Adwaita/index.theme
      EOF

  - trigger: post-packages
    action: |-
      #!/bin/sh -eu
      umount -l /etc/resolv.conf 2>/dev/null || true
      rm -f /etc/resolv.conf
      ln -s /run/systemd/resolve/stub-resolv.conf /etc/resolv.conf

      # Fix ping
      setcap cap_net_raw=ep /usr/bin/ping || chmod +s /usr/bin/ping
  - trigger: post-files
    action: |-
      #!/bin/sh -eu
      if [ -x /root/setup.sh ]; then
        /root/setup.sh
        rm -f /root/setup.sh
      fi
      if [ -x /root/remove-docs.sh ]; then
        /root/remove-docs.sh
        rm -f /root/remove-docs.sh
      fi

mappings:
  architecture_map: archlinux
