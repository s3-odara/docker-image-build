image:
  distribution: archlinux
  description: Arch Linux Custom Image
  architecture: x86_64

source:
  downloader: archlinux-http
  url: https://archive.archlinux.org/iso
  keys:
    - 4AA4767BBC9C4B1D18AE28B77F2D434B9741E8AC

targets:
  lxc:
    config:
      - type: all
        content: |-
          lxc.include = LXC_TEMPLATE_CONFIG/common.conf
          lxc.include = LXC_TEMPLATE_CONFIG/userns.conf
          lxc.arch = x86_64

files:
  - generator: dump
    path: /etc/systemd/network/eth0.network
    content: |-
      [Match]
      Name=eth0

      [Network]
      DHCP=yes
  - generator: copy
    source: ./scripts/setup.sh
    path: /root/setup.sh
    mode: 0755


packages:
  manager: pacman
  update: true
  cleanup: true
  
  sets:
    - packages:
        - base
        - linux
      action: install

actions:
  - trigger: post-unpack
    action: |-
      #!/bin/bash
      pacman -Sy --noconfirm archlinux-keyring
  - trigger: post-files
    action: |-
      #!/bin/bash
      /root/setup.sh
      rm /root/setup.sh

