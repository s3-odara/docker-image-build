image:
  distribution: archlinux
  description: Arch Linux Custom Image
  architecture: x86_64

source:
  downloader: archlinux-http
  url: https://archive.archlinux.org/iso
  keys:
    - 4AA4767BBC9C4B1D18AE28B77F2D434B9741E8AC

files:
  - generator: dump
    path: /etc/systemd/network/eth0.network
    content: |-
      [Match]
      Name=eth0

      [Network]
      DHCP=yes
  - generator: copy
    source: ./images/scripts/setup.sh
    path: /root/setup.sh
    mode: 0755
  - generator: copy
    source: ./images/scripts/remove-docs.sh
    path: /root/remove-docs.sh
    mode: 0755

packages:
  manager: pacman
  update: true
  cleanup: true

  sets:
    - packages:
        - base
        - base-devel
        - vi
        - tmux
        - gnupg
        - zsh
        - zsh-syntax-highlighting
        - zsh-autosuggestions
        - git
        - vim
        - wget
        - curl
        - lldb
        - openssh
        - doas
        - mold
        - ccache
        - zsh-completions
        - stow
        - knot-resolver
        - unzip
        - pacman-contrib
        - less
        - bc
        - tcpdump
        - strace
        - htop
        - ed
        - libxml2
        - ripgrep
        - fzf
        - html-xml-utils
        - pass
        - gopls
        - lua-language-server
        - lua
        - clang
        - yaml-language-server
        - rust-analyzer
        - vscode-html-languageserver
        - bash-language-server
        - ty
        - ruff
        - taplo-cli
        - typos-lsp
        - words
        - sccache
        - lsof
        - socat
        - openbsd-netcat
        - npm
        - python-pip
        - mtr
        - moreutils
      action: install

actions:
  - trigger: post-unpack
    action: |-
      #!/bin/sh -eu
      if ! grep -q '^Include = /etc/pacman.d/noextract.conf' /etc/pacman.conf; then
        sed -i '/^\[options\]/a Include = /etc/pacman.d/noextract.conf' /etc/pacman.conf
      fi
      cat >/etc/pacman.d/noextract.conf <<'EOF'
      NoExtract = usr/share/doc/* usr/share/gtk-doc/* usr/share/help/* usr/share/info/* usr/share/man/*
      NoExtract = usr/share/locale/*
      NoExtract = !usr/share/locale/locale.alias
      NoExtract = usr/share/icons/*
      NoExtract = !usr/share/icons/hicolor/*
      NoExtract = !usr/share/icons/Adwaita/symbolic/*
      NoExtract = !usr/share/icons/Adwaita/index.theme
      EOF

  - trigger: post-packages
    action: |-
      #!/bin/sh -eu
      umount -l /etc/resolv.conf 2>/dev/null || true
      rm -f /etc/resolv.conf
      ln -s /run/systemd/resolve/stub-resolv.conf /etc/resolv.conf

      # Fix ping
      setcap cap_net_raw=ep /usr/bin/ping || chmod +s /usr/bin/ping
  - trigger: post-files
    action: |-
      #!/bin/sh -eu
      if [ -x /root/setup.sh ]; then
        /root/setup.sh
        rm -f /root/setup.sh
      fi
      if [ -x /root/remove-docs.sh ]; then
        /root/remove-docs.sh
        rm -f /root/remove-docs.sh
      fi
