image:
  distribution: archlinux
  description: Arch Linux Custom Image
  architecture: x86_64

source:
  downloader: archlinux-http
  url: https://archive.archlinux.org/iso
  keys:
    - 4AA4767BBC9C4B1D18AE28B77F2D434B9741E8AC

targets:
  lxc:
    config:
      - type: all
        content: |-
          lxc.include = LXC_TEMPLATE_CONFIG/common.conf
          lxc.include = LXC_TEMPLATE_CONFIG/userns.conf
          lxc.arch = x86_64

files:
  - generator: dump
    path: /etc/systemd/network/eth0.network
    content: |-
      [Match]
      Name=eth0

      [Network]
      DHCP=yes
  - generator: copy
    source: ./images/scripts/setup.sh
    path: /root/setup.sh
    mode: 0755

  - name: meta-data
    generator: cloud-init

  - name: network-config
    generator: cloud-init

  - name: user-data
    generator: cloud-init

  - name: vendor-data
    generator: cloud-init

packages:
  manager: pacman
  update: true
  cleanup: true
  
  sets:
    - packages:
        - base
        - base-devel
        - vi
        - tmux
        - gnupg
        - zsh
        - zsh-syntax-highlighting
        - zsh-autosuggestions
        - git
        - vim
        - wget
        - curl
        - man-db
        - openssh
        - doas
        - mold
        - ccache
        - cloud-init
        - zsh-completions 
        - stow
        - knot-resolver
      action: install

actions:
  - trigger: post-unpack
    action: |-
      #!/bin/bash
      pacman -Sy --noconfirm archlinux-keyring
  - trigger: post-files
    action: |-
      #!/bin/bash
      /root/setup.sh
      rm /root/setup.sh

