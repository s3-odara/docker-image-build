image:
  distribution: archlinux
  description: Arch Linux Custom Image (VM)
  architecture: x86_64

source:
  downloader: archlinux-http
  url: https://archive.archlinux.org/iso
  keys:
    - 4AA4767BBC9C4B1D18AE28B77F2D434B9741E8AC

files:
  - generator: dump
    path: /etc/systemd/network/enp5s0.network
    content: |-
      [Match]
      Name=enp5s0

      [Network]
      DHCP=ipv4

      [DHCPv4]
      UseDomains=true
      UseMTU=true

      [DHCP]
      ClientIdentifier=mac
    types:
      - vm
  - generator: incus-agent
    types:
      - vm
  - generator: fstab
    types:
      - vm
  - generator: dump
    path: /etc/default/grub
    content: |-
      # Set the recordfail timeout
      GRUB_RECORDFAIL_TIMEOUT=0

      # Do not wait on grub prompt
      GRUB_TIMEOUT=0

      # Set the default commandline
      GRUB_CMDLINE_LINUX_DEFAULT="${GRUB_CMDLINE_LINUX_DEFAULT} console=tty1 console=ttyS0"

      # Set the grub console type
      GRUB_TERMINAL=console
    types:
      - vm
  # NOTE: Do not expose 3389/tcp directly; use an Incus proxy device or SSH tunnel to keep it host-local.
  - generator: dump
    path: /etc/systemd/system/weston-rdp.service
    content: |-
      [Unit]
      Description=Weston RDP backend (headless)
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=simple
      RuntimeDirectory=weston
      RuntimeDirectoryMode=0700
      Environment=XDG_RUNTIME_DIR=/run/weston
      ExecStart=/usr/bin/weston --backend=rdp --shell=desktop-shell.so --renderer=pixman --address=0.0.0.0 --port=3389 --rdp-tls-key=/etc/weston-rdp/tls.key --rdp-tls-cert=/etc/weston-rdp/tls.crt
      Restart=on-failure

      [Install]
      WantedBy=multi-user.target
    types:
      - vm
  - generator: copy
    source: ./images/scripts/setup.sh
    path: /root/setup.sh
    mode: 0755

packages:
  manager: pacman
  update: true
  cleanup: true

  sets:
    - packages:
        - base
        - base-devel
        - vi
        - tmux
        - gnupg
        - zsh
        - zsh-syntax-highlighting
        - zsh-autosuggestions
        - git
        - vim
        - wget
        - curl
        - openssh
        - doas
        - mold
        - ccache
        - zsh-completions
        - stow
        - knot-resolver
        - unzip
        - pacman-contrib
        - less
        - bc
        - tcpdump
        - strace
        - htop
        - ed
        - grub
        - cloud-guest-utils
        - linux
        - weston
        - freerdp
        - openssl
        - ttf-dejavu
      action: install

actions:
  - trigger: post-unpack
    action: |-
      #!/bin/sh -eu
      # The [community] repo has moved into [extra]
      sed -ri '/^\[community\]$/,+2d' /etc/pacman.conf
      pacman -Sy --needed --noconfirm archlinux-keyring

      if ! grep -q '^Include = /etc/pacman.d/noextract.conf' /etc/pacman.conf; then
        sed -i '/^\[options\]/a Include = /etc/pacman.d/noextract.conf' /etc/pacman.conf
      fi
      cat >/etc/pacman.d/noextract.conf <<'NOEXTRACT'
      NoExtract = usr/share/doc/* usr/share/gtk-doc/* usr/share/help/* usr/share/info/* usr/share/man/*
      NoExtract = usr/share/locale/*
      NoExtract = !usr/share/locale/locale.alias
      NOEXTRACT

  - trigger: post-packages
    action: |-
      #!/bin/sh -eu
      umount -l /etc/resolv.conf || true
      rm -f /etc/resolv.conf
      ln -sf /run/systemd/resolve/resolv.conf /etc/resolv.conf
      systemctl enable systemd-networkd
      systemctl enable systemd-resolved

      # Fix ping
      setcap cap_net_raw=ep /usr/bin/ping || chmod +s /usr/bin/ping

  - trigger: post-files
    action: |-
      #!/bin/sh -eu
      if [ -x /root/setup.sh ]; then
        /root/setup.sh
        rm -f /root/setup.sh
      fi
      # ドキュメント、マニュアル、ヘルプファイルを削除
      for dir in /usr/share/doc /usr/share/gtk-doc /usr/share/help /usr/share/info /usr/share/man; do
        if [ -d "$dir" ]; then
          find "$dir" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
        fi
      done
      if [ -d /usr/share/locale ]; then
        find /usr/share/locale -mindepth 1 -maxdepth 1 -type d ! -name 'en' ! -name 'ja' -exec rm -rf -- {} + || true
      fi

  - trigger: post-files
    action: |-
      #!/bin/sh -eu
      install -d -m 0700 /etc/weston-rdp
      if [ ! -s /etc/weston-rdp/tls.key ] || [ ! -s /etc/weston-rdp/tls.crt ]; then
        umask 077
        openssl req -x509 -newkey rsa:2048 -nodes -sha256 -days 3650 \
          -subj "/CN=incus-vm" \
          -keyout /etc/weston-rdp/tls.key \
          -out /etc/weston-rdp/tls.crt
      fi
      chmod 0600 /etc/weston-rdp/tls.key
      chmod 0644 /etc/weston-rdp/tls.crt
      systemctl enable weston-rdp.service
    types:
      - vm

  - trigger: post-files
    action: |-
      #!/bin/sh -eu
      # Automatic disk resize
      cat << 'EOF' > /etc/systemd/system/incus-growpart.service
      [Unit]
      Description=Incus - grow root partition

      [Service]
      Type=oneshot
      ExecStartPre=-/usr/sbin/growpart /dev/sda 2
      ExecStart=/usr/sbin/resize2fs /dev/sda2

      [Install]
      WantedBy=default.target
      EOF
      systemctl enable incus-growpart
    types:
      - vm

  - trigger: post-files
    action: |-
      #!/bin/sh -eu
      TARGET="x86_64"
      [ "$(uname -m)" = "aarch64" ] && TARGET="arm64"
      [ "$(uname -m)" = "riscv64" ] && TARGET="riscv64"

      grub-install --target="${TARGET}-efi" --efi-directory=/boot/efi --no-nvram --removable
      grub-install --target="${TARGET}-efi" --efi-directory=/boot/efi --no-nvram
      grub-mkconfig -o /boot/grub/grub.cfg
      sed -i "s#root=[^ ]*#root=${DISTROBUILDER_ROOT_UUID}#g" /boot/grub/grub.cfg

      # Rebuild initrd
      sed -i 's#^MODULES=.*#MODULES=(virtio_pci virtio_scsi virtio_console)#' /etc/mkinitcpio.conf
      sed -i 's#^PRESETS=.*#PRESETS=(default)#' /etc/mkinitcpio.d/*.preset
      mkinitcpio -P || true
    types:
      - vm

  - trigger: post-files
    action: |-
      #!/bin/sh -eu
      # Remove machine-id as this is necessary for systemd units with ConditionFirstBoot=yes
      rm -f /etc/machine-id
    types:
      - vm
