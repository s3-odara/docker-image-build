name: Build Arch Linux Incus Images

on:
  schedule:
    - cron: "17 20 * * 4"
  push:
    branches:
      - master
    paths:
      - ".github/workflows/build-arch-incus.yml"
      - ".github/workflows/build-arch-incus-vm.yml"
      - "images/archlinux.yml"
      - "images/archlinux-vm.yml"
      - "images/scripts/**"
      - "scripts/ci/**"
  pull_request:
    branches:
      - master
    paths:
      - ".github/workflows/build-arch-incus.yml"
      - ".github/workflows/build-arch-incus-vm.yml"
      - "images/archlinux.yml"
      - "images/archlinux-vm.yml"
      - "images/scripts/**"
      - "scripts/ci/**"
  workflow_dispatch:
    inputs:
      iso_release:
        description: "Arch ISO release date (YYYY.MM.DD). Empty = latest from archive."
        required: false
        type: string

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
      options: --privileged

    environment:
      name: test
      deployment: false

    permissions:
      contents: read

    concurrency:
      group: arch-incus-build-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Install System Dependencies
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm
          pacman -S --noconfirm \
            git \
            zstd \
            distrobuilder \
            squashfs-tools \
            rsync \
            curl \
            unzip \
            jq \
            qemu-base \
            dosfstools \
            btrfs-progs

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Generate Build Variables
        id: vars
        run: |
          bash scripts/ci/generate-build-variables.sh
        env:
          ISO_RELEASE_INPUT: ${{ github.event.inputs.iso_release }}

      - name: Build Incus Container Image
        env:
          USER_PASSWORD: ${{ vars.INCUS_USER_PASSWORD }}
          SSH_KEY: ${{ vars.INCUS_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p /var/cache/distrobuilder

          distrobuilder build-incus images/archlinux.yml \
            --cache-dir /var/cache/distrobuilder \
            --cleanup=false \
            -o image.release=${{ steps.vars.outputs.iso_release }} \
            -o image.serial=${{ steps.vars.outputs.build_serial }} \
            -o image.architecture=x86_64 \
            -o image.variant=default \
            --compression zstd

          test -s incus.tar.zst
          test -s rootfs.squashfs

          mv incus.tar.zst incus-container.tar.zst
          mv rootfs.squashfs rootfs-container.squashfs

      - name: Build Incus VM Image
        env:
          USER_PASSWORD: ${{ vars.INCUS_USER_PASSWORD }}
          SSH_KEY: ${{ vars.INCUS_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p /var/cache/distrobuilder

          distrobuilder build-incus images/archlinux-vm.yml \
            --vm \
            --cache-dir /var/cache/distrobuilder \
            --cleanup=false \
            -o image.release=${{ steps.vars.outputs.iso_release }} \
            -o image.serial=${{ steps.vars.outputs.build_serial }} \
            -o image.architecture=x86_64 \
            -o image.variant=default \
            --compression zstd

          test -s incus.tar.zst
          test -s disk.qcow2

          mv incus.tar.zst incus-vm.tar.zst
          mv disk.qcow2 disk-vm.qcow2

      - name: Upload Image Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: arch-incus-images
          path: |
            incus-container.tar.zst
            rootfs-container.squashfs
            incus-vm.tar.zst
            disk-vm.qcow2
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  deploy:
    needs: build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    environment:
      name: production

    permissions:
      contents: read

    concurrency:
      group: r2-filess3-odaranet-container
      cancel-in-progress: false

    env:
      AWS_DEFAULT_REGION: auto
      R2_ENDPOINT_URL: https://6ecd930c8cd4dc63f87c9398762626e8.r2.cloudflarestorage.com
      R2_BUCKET_URI: s3://filess3-odaranet/pub/container

    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm \
          incus-tools \
          aws-cli

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download Image Artifacts
        uses: actions/download-artifact@v8
        with:
          name: arch-incus-images
          path: artifacts

      - name: Sync Current Repository from R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          mkdir -p repo

          aws s3 sync \
            "$R2_BUCKET_URI" \
            ./repo \
            --endpoint-url "$R2_ENDPOINT_URL"

      - name: Add Images to Repository
        run: |
          set -euo pipefail
          cd repo

          incus-simplestreams add \
            --no-default-alias \
            --alias archlinux/latest \
            ../artifacts/incus-container.tar.zst \
            ../artifacts/rootfs-container.squashfs

          incus-simplestreams add \
            --no-default-alias \
            --alias archlinux/vm \
            ../artifacts/incus-vm.tar.zst \
            ../artifacts/disk-vm.qcow2

      - name: Prune Old Products
        run: |
          set -euo pipefail
          cd repo
          bash ../images/scripts/simplestreams-prune-products.sh

      - name: Cleanup Old Images
        run: |
          set -euo pipefail
          cd repo
          incus-simplestreams prune --retention 1

      - name: Upload Changes to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail

          aws s3 sync \
            ./repo \
            "$R2_BUCKET_URI" \
            --endpoint-url "$R2_ENDPOINT_URL" \
            --delete
