name: Build Arch Linux Incus Image

on:
  push:
    paths:
      - 'images/archlinux.yml'
      - 'images/scripts/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    environment: cloudflare-r2-filess3-odaranet

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap rsync gpg squashfs-tools zstd

      - name: Setup Go and Install Tools
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - name: Install Incus Simplestreams
        run: go install github.com/lxc/incus/cmd/incus-simplestreams@latest

      - name: Install Distrobuilder & Dependencies
        run: |
          sudo snap install distrobuilder --classic

      - name: Cache Distrobuilder Assets
        uses: actions/cache@v3
        with:
          path: /var/cache/distrobuilder
          key: distrobuilder-${{ runner.os }}-${{ hashFiles('images/archlinux.yml') }}-${{ env.ISO_RELEASE }}
          restore-keys: |
            distrobuilder-${{ runner.os }}-${{ hashFiles('images/archlinux.yml') }}-

      - name: Generate Build Variables
        id: vars
        run: |
          echo "BUILD_SERIAL=$(date +%Y%m%d_%H%M)" >> $GITHUB_ENV
          
          INPUT_RELEASE="${{ github.event.inputs.iso_release }}"
          
          if [ -n "$INPUT_RELEASE" ]; then
            ISO_RELEASE="$INPUT_RELEASE"
            echo "Using manual input: $ISO_RELEASE"
          else
            echo "Fetching latest ISO release date from archive.archlinux.org..."
            
            LATEST_DATE=$(curl -sL https://archive.archlinux.org/iso/ | \
                          grep -oE '[0-9]{4}\.[0-9]{2}\.[0-9]{2}' | \
                          sort -Vu | \
                          tail -n 1)
            
            if [ -z "$LATEST_DATE" ]; then
              echo "Error: Failed to fetch latest date. Fallback to 'current'."
              ISO_RELEASE="current"
            else
              ISO_RELEASE="$LATEST_DATE"
            fi
            echo "Detected latest release: $ISO_RELEASE"
          fi
          
          echo "ISO_RELEASE=$ISO_RELEASE" >> $GITHUB_ENV

      - name: Build Incus Image
        run: |
          sudo mkdir -p /var/cache/distrobuilder

          sudo distrobuilder build-incus images/archlinux.yml \
            --cache-dir /var/cache/distrobuilder \
            --cleanup=false \
            -o image.release=${{ env.ISO_RELEASE }} \
            -o image.serial=${{ env.BUILD_SERIAL }} \
            -o image.architecture=x86_64 \
            -o image.variant=default \
            --compression zstd

      - name: Fix Cache Permissions
        run: |
          sudo chown -R $USER:$USER /var/cache/distrobuilder

      - name: Sync current repo from R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT_URL: https://6ecd930c8cd4dc63f87c9398762626e8.r2.cloudflarestorage.com
          R2_BUCKET_PATH: s3://filess3-odaranet/pub/container
        run: |
          mkdir -p repo
          aws s3 sync "$R2_BUCKET_PATH" ./repo --endpoint-url "$R2_ENDPOINT_URL" || true

      - name: Add Image to Repository
        run: |
          cd repo
          
          sudo ~/go/bin/incus-simplestreams add \
            ../incus.tar.zst \
            ../rootfs.squashfs \

      - name: Cleanup Old Images
        run: |
          cd repo
          KEEP_COUNT=2
          
          echo "Pruning index to keep only the latest $KEEP_COUNT versions per product..."

          sudo jq --argjson k "$KEEP_COUNT" '
            .products |= with_entries(
              .value.versions |= (
                to_entries 
                | sort_by(.key) 
                | reverse 
                | .[0:$k] 
                | from_entries
              )
            )
          ' streams/v1/images.json > images.json.tmp
          
          sudo cp images.json.tmp streams/v1/images.json
          sudo rm images.json.tmp
          
          echo "Index updated."
          echo "Running garbage collection for orphaned files..."

          jq -r '.. | .path? | select(.)' streams/v1/images.json | sort > referenced_files.txt
          find images -type f | sort > actual_files.txt
          comm -23 actual_files.txt referenced_files.txt | while read -r file; do
            echo "Deleting orphaned file: $file"
            sudo rm -f "$file"
          done

          rm referenced_files.txt actual_files.txt

      - name: Upload changes to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT_URL: https://6ecd930c8cd4dc63f87c9398762626e8.r2.cloudflarestorage.com
          R2_BUCKET_PATH: filess3-odaranet/pub/container
        run: |
          aws s3 sync ./repo "s3://$R2_BUCKET_PATH" \
            --endpoint-url "$R2_ENDPOINT_URL" \
            --delete
