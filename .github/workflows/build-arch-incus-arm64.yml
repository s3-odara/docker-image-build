name: Build Arch Linux ARM64 Incus Image

on:
  schedule:
    - cron: "17 20 * * 4"
  push:
    branches:
      - master
    paths:
      - ".github/workflows/build-arch-incus-arm64.yml"
      - "images/archlinuxarm.yml"
      - "images/scripts/**"
      - "scripts/ci/**"
  pull_request:
    branches:
      - master
    paths:
      - ".github/workflows/build-arch-incus-arm64.yml"
      - "images/archlinuxarm.yml"
      - "images/scripts/**"
      - "scripts/ci/**"
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    container:
      image: lfdevs/archlinuxarm:base-devel
      options: --privileged

    environment:
      name: test
      deployment: false

    permissions:
      contents: read

    concurrency:
      group: arch-incus-arm64-build-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Install System Dependencies
        run: |
          set -euo pipefail

          pacman -Syu --noconfirm
          pacman -S --noconfirm \
            git \
            zstd \
            distrobuilder \
            squashfs-tools \
            rsync \
            curl \
            unzip \
            jq

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Generate Build Variables
        id: vars
        run: |
          set -euo pipefail
          bash scripts/ci/generate-build-variables.sh
        env:
          SKIP_ISO_RELEASE: "1"

      - name: Build Incus Container Image
        env:
          USER_PASSWORD: ${{ vars.INCUS_USER_PASSWORD }}
          SSH_KEY: ${{ vars.INCUS_SSH_KEY }}
        run: |
          set -euo pipefail

          mkdir -p /var/cache/distrobuilder

          echo \
            'Server = http://nj.us.mirror.archlinuxarm.org/$arch/$repo' \
            > /etc/pacman.d/mirrorlist

          distrobuilder build-incus images/archlinuxarm.yml \
            --cache-dir /var/cache/distrobuilder \
            --cleanup=false \
            -o image.serial=${{ steps.vars.outputs.build_serial }} \
            -o image.architecture=aarch64 \
            -o image.variant=default \
            --compression zstd

          test -s incus.tar.zst
          test -s rootfs.squashfs

          mv incus.tar.zst incus-container.tar.zst
          mv rootfs.squashfs rootfs-container.squashfs

      - name: Upload Image Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: arch-incus-arm64-image
          path: |
            incus-container.tar.zst
            rootfs-container.squashfs
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  deploy:
    needs: build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    environment:
      name: production

    permissions:
      contents: read

    concurrency:
      group: r2-filess3-odaranet-container-arm64
      cancel-in-progress: false

    env:
      AWS_DEFAULT_REGION: auto
      R2_ENDPOINT_URL: https://6ecd930c8cd4dc63f87c9398762626e8.r2.cloudflarestorage.com
      R2_BUCKET_URI: s3://filess3-odaranet/pub/container-arm64

    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm \
          incus-tools \
          jq \
          aws-cli

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download Image Artifacts
        uses: actions/download-artifact@v8
        with:
          name: arch-incus-arm64-image
          path: artifacts

      - name: Sync Current Repository from R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail

          mkdir -p repo

          aws s3 sync \
            "$R2_BUCKET_URI" \
            ./repo \
            --endpoint-url "$R2_ENDPOINT_URL"

      - name: Add Image to Repository
        run: |
          set -euo pipefail

          cd repo

          incus-simplestreams add \
            --no-default-alias \
            --alias archlinux/latest \
            ../artifacts/incus-container.tar.zst \
            ../artifacts/rootfs-container.squashfs

      - name: Prune Old Products
        run: |
          set -euo pipefail

          cd repo
          bash ../images/scripts/simplestreams-prune-products.sh

      - name: Cleanup Old Images
        run: |
          set -euo pipefail

          cd repo
          incus-simplestreams prune --retention 0

      - name: Upload Changes to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail

          aws s3 sync \
            ./repo \
            "$R2_BUCKET_URI" \
            --endpoint-url "$R2_ENDPOINT_URL" \
            --delete
