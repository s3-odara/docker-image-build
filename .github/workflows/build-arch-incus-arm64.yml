name: Build Arch Linux ARM64 Incus Image

on:
  schedule:
    - cron: "17 20 * * 4"
  push:
    paths:
      - ".github/workflows/build-arch-incus-arm64.yml"
      - "images/archlinuxarm.yml"
      - "images/scripts/**"
      - "scripts/ci/**"
  workflow_dispatch:
    inputs:
      incus_version:
        description: "incus-simplestreams version (e.g. v6.0.0). Empty = latest tag."
        required: false
        type: string

concurrency:
  group: arch-incus-arm64-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    container:
      image: lfdevs/archlinuxarm:base-devel
      options: --privileged
    environment: cloudflare-r2-filess3-odaranet
    permissions:
      contents: read

    steps:
      - name: Install System Dependencies
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm
          pacman -S --noconfirm git go zstd distrobuilder aws-cli squashfs-tools rsync curl unzip jq

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Generate Build Variables
        id: vars
        run: |
          bash scripts/ci/generate-build-variables.sh
        env:
          SKIP_ISO_RELEASE: "1"
          INCUS_VERSION_INPUT: ${{ github.event.inputs.incus_version }}

      - name: Install Incus Simplestreams
        run: |
          set -euo pipefail
          export GOPATH=/root/go
          export PATH="$PATH:$GOPATH/bin"
          go install "github.com/lxc/incus/v6/cmd/incus-simplestreams@${{ steps.vars.outputs.incus_version }}"

      - name: Build Incus Container Image
        env:
          USER_PASSWORD: ${{ secrets.INCUS_USER_PASSWORD }}
          SSH_KEY: ${{ secrets.INCUS_SSH_KEY }}
        run: |
          set -euo pipefail
          export GOPATH=/root/go
          export PATH="$PATH:$GOPATH/bin"
          mkdir -p /var/cache/distrobuilder
          echo 'Server = http://nj.us.mirror.archlinuxarm.org/$arch/$repo' > /etc/pacman.d/mirrorlist

          distrobuilder build-incus images/archlinuxarm.yml \
            --cache-dir /var/cache/distrobuilder \
            --cleanup=false \
            -o image.serial=${{ steps.vars.outputs.build_serial }} \
            -o image.architecture=aarch64 \
            -o image.variant=default \
            --compression zstd
          test -s incus.tar.zst
          test -s rootfs.squashfs
          mv incus.tar.zst incus-container.tar.zst
          mv rootfs.squashfs rootfs-container.squashfs

      - name: Sync current repo from R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT_URL: https://6ecd930c8cd4dc63f87c9398762626e8.r2.cloudflarestorage.com
          R2_BUCKET_PATH: s3://filess3-odaranet/pub/container-arm64
        run: |
          set -euo pipefail
          mkdir -p repo
          if ! aws s3 sync "$R2_BUCKET_PATH" ./repo --endpoint-url "$R2_ENDPOINT_URL"; then
            echo "::warning::Failed to sync existing repository from R2 (continuing with empty repo)."
          fi

      - name: Add Images to Repository
        run: |
          set -euo pipefail
          export GOPATH=/root/go
          export PATH="$PATH:$GOPATH/bin"
          cd repo

          incus-simplestreams add \
            --no-default-alias \
            --alias archlinux/latest \
            ../incus-container.tar.zst \
            ../rootfs-container.squashfs

      - name: Prune Old Products (keep newest per OS/variant/arch)
        run: |
          set -euo pipefail
          cd repo
          bash ../images/scripts/simplestreams-prune-products.sh

      - name: Cleanup Old Images
        run: |
          set -euo pipefail
          export GOPATH=/root/go
          export PATH="$PATH:$GOPATH/bin"
          cd repo
          incus-simplestreams prune --retention 0

      - name: Upload changes to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT_URL: https://6ecd930c8cd4dc63f87c9398762626e8.r2.cloudflarestorage.com
          R2_BUCKET_PATH: filess3-odaranet/pub/container-arm64
        run: |
          set -euo pipefail
          aws s3 sync ./repo "s3://$R2_BUCKET_PATH" \
            --endpoint-url "$R2_ENDPOINT_URL" \
            --delete
